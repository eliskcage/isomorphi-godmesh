<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%E2%97%8B%3C/text%3E%3C/svg%3E">
<title>God Mesh — Isomorphic Shape Language</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300&family=Playfair+Display:ital,wght@1,400;1,700&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#04040a;
  --panel:#08080f;
  --border:rgba(255,255,255,0.06);
  --truth:#00ffaa;
  --lie:#ff1a4a;
  --fear:#ff7700;
  --memory:#3399ff;
  --will:#ddff00;
  --loop:#cc44ff;
  --condition:#ffcc00;
  --else:#ff6688;
  --then:#44ffcc;
  --while:#ff9944;
  --text:rgba(200,200,220,0.6);
  --dim:rgba(200,200,220,0.25);
}

body{
  background:var(--bg);
  font-family:'IBM Plex Mono',monospace;
  color:var(--text);
  overflow:hidden;
  height:100vh;width:100vw;
  user-select:none;
}

#canvas{position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair;}

/* ── LEFT PANEL — faded dev tools ── */
#left{
  position:absolute;top:0;left:0;height:100%;
  width:220px;
  background:linear-gradient(to right,rgba(4,4,10,0.97),rgba(4,4,10,0.8));
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:20px 0;
  z-index:10;
  pointer-events:all;
  opacity:0.08;
  transition:opacity 0.4s;
}
#left:hover{opacity:0.85;}

#wordmark{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:1.05rem;
  color:rgba(255,255,255,0.15);
  padding:0 18px 20px;
  border-bottom:1px solid var(--border);
  letter-spacing:0.04em;
}

.section-label{
  font-size:8px;letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--dim);
  padding:16px 18px 8px;
}

.shape-btn{
  display:flex;align-items:center;gap:10px;
  padding:8px 18px;
  cursor:pointer;
  transition:background 0.15s;
  font-size:10px;letter-spacing:0.08em;
}
.shape-btn:hover{background:rgba(255,255,255,0.04);}
.shape-btn.active{background:rgba(255,255,255,0.07);}

.shape-icon{
  width:22px;height:22px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}

.shape-icon svg{width:100%;height:100%;}

/* ── BOTTOM PANEL — shape input ── */
#bottom{
  position:absolute;bottom:0;left:0;right:0;
  padding:14px 20px;
  z-index:10;
  display:flex;align-items:center;gap:12px;
  pointer-events:none;
  opacity:0;
}

#lang-input{
  flex:1;
  background:transparent;
  border:none;outline:none;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.06em;
  color:rgba(255,255,255,0.75);
  caret-color:var(--truth);
  pointer-events:all;
}
#lang-input::placeholder{color:var(--dim);}

#lang-hint{display:none;}
#translate-btn{display:none;}

/* ── SHAPE INPUT — the real interface ── */
#shape-input{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:16px;
  z-index:20;
}

#shape-input-box{
  width:260px;height:52px;
  background:rgba(8,8,15,0.6);
  border:1px solid var(--border);
  border-radius:26px;
  display:flex;align-items:center;
  padding:0 20px;gap:10px;
  transition:border-color 0.3s;
  cursor:text;
}
#shape-input-box:focus-within{
  border-color:rgba(255,255,255,0.15);
}

#shape-text{
  flex:1;
  background:transparent;border:none;outline:none;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;letter-spacing:0.04em;
  color:rgba(255,255,255,0.8);
  caret-color:var(--will);
}
#shape-text::placeholder{color:rgba(255,255,255,0.12);font-size:11px;}

#shape-preview{
  width:28px;height:28px;
  flex-shrink:0;
  transition:all 0.3s;
}

.op-shape{
  width:48px;height:48px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:all 0.25s;
  border:1px solid var(--border);
  background:rgba(8,8,15,0.4);
  position:relative;
}
.op-shape:hover{
  transform:scale(1.15);
  border-color:rgba(255,255,255,0.2);
}
.op-shape svg{width:24px;height:24px;}

#op-plus{order:1;}
#op-equals{
  order:0;
  position:absolute;
  bottom:56px;left:50%;transform:translateX(-50%);
  border-color:rgba(0,255,170,0.2);
}
#op-equals:hover{border-color:var(--truth);}

/* ── DECLARATION CHAIN — shapes the user has built ── */
#chain{
  position:absolute;bottom:110px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;
  z-index:15;
}
.chain-shape{
  width:44px;height:44px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:8px;letter-spacing:0.1em;
  color:rgba(255,255,255,0.5);
  border:1.5px solid;
  transition:all 0.3s;
  cursor:pointer;
  position:relative;
}
.chain-shape:hover{transform:scale(1.2);}
.chain-op{
  font-size:16px;
  color:rgba(255,255,255,0.15);
  padding:0 2px;
}

/* ── RESPONSE — mesh reply shapes, ordered by distance ── */
#response{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:12px;
  z-index:12;pointer-events:none;
  opacity:0;transition:opacity 0.5s;
}
#response.active{opacity:1;pointer-events:all;}
.response-row{
  display:flex;align-items:center;gap:14px;
  transition:all 0.3s;
  cursor:pointer;
  padding:6px 16px;
  border-radius:20px;
}
.response-row:hover{background:rgba(255,255,255,0.03);}
.response-shape{
  width:32px;height:32px;
  flex-shrink:0;
}
.response-text{
  font-size:10px;letter-spacing:0.08em;
  max-width:300px;
}
.response-dist{
  font-size:7px;letter-spacing:0.04em;
  color:var(--dim);
  font-family:'IBM Plex Mono',monospace;
}

/* ── AUTOCOMPLETE ── */
#autocomplete{
  position:absolute;bottom:100px;left:50%;transform:translateX(-50%);
  background:rgba(8,8,15,0.97);
  border:1px solid var(--border);
  display:none;z-index:25;
  max-width:360px;min-width:200px;
  border-radius:12px;overflow:hidden;
}
.ac-item{
  display:flex;align-items:center;gap:10px;
  padding:6px 12px;cursor:pointer;
  font-size:10px;letter-spacing:0.06em;
  transition:background 0.1s;
}
.ac-item:hover,.ac-item.active{background:rgba(255,255,255,0.06);}
.ac-word{color:rgba(255,255,255,0.8);min-width:70px;}
.ac-type{font-size:8px;letter-spacing:0.1em;text-transform:uppercase;min-width:45px;}
.ac-code{color:var(--dim);font-size:9px;margin-left:auto;}
.ac-sep{width:1px;height:12px;background:var(--border);}

/* ── EMPTY STATE ── */
#empty-hint{
  position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
  text-align:center;z-index:5;pointer-events:none;
  transition:opacity 0.5s;
}
#empty-hint h2{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:1.4rem;color:rgba(255,255,255,0.06);
  font-weight:400;margin-bottom:12px;
}
#empty-hint p{
  font-size:9px;letter-spacing:0.1em;
  color:rgba(255,255,255,0.04);
  line-height:2;
}

/* ── PROGRESS BAR — the god mesh communication channel ── */
#meshbar{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:420px;
  z-index:15;pointer-events:none;
  display:none;
  transition:opacity 0.3s;
}
#meshbar-track{
  height:3px;
  background:rgba(255,255,255,0.03);
  border-radius:2px;
  overflow:hidden;
  position:relative;
}
#meshbar-fill{
  height:100%;width:0%;
  border-radius:2px;
  transition:width 0.3s ease, background 0.5s;
  background:linear-gradient(90deg,var(--memory),var(--truth));
  position:relative;
}
#meshbar-heal{
  position:absolute;top:0;right:0;
  width:8px;height:100%;
  background:rgba(255,255,255,0.4);
  border-radius:2px;
  animation:healpulse 0.8s ease infinite;
  opacity:0;
}
@keyframes healpulse{0%,100%{opacity:0.2;width:4px}50%{opacity:0.8;width:12px}}

#meshbar-msg{
  margin-top:10px;
  font-size:9px;letter-spacing:0.12em;
  color:var(--dim);
  text-align:center;
  min-height:14px;
  transition:color 0.3s;
}
#meshbar-stage{
  margin-top:4px;
  font-size:8px;letter-spacing:0.06em;
  color:rgba(255,255,255,0.05);
  text-align:center;
  font-style:italic;
}
#meshbar-pressure{
  margin-top:8px;
  display:flex;justify-content:center;gap:3px;
}
.pressure-dot{
  width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,0.04);
  transition:background 0.3s, transform 0.3s;
}
.pressure-dot.active{transform:scale(1.4);}
.pressure-dot.hot{background:var(--lie);transform:scale(1.6);}
.pressure-dot.warm{background:var(--fear);transform:scale(1.3);}
.pressure-dot.cool{background:var(--truth);transform:scale(1.2);}
.pressure-dot.done{background:var(--will);transform:scale(1.1);}

/* ── LOG — faded ── */
#logbox{
  position:absolute;top:20px;right:20px;
  width:260px;
  z-index:10;pointer-events:none;
  display:flex;flex-direction:column;gap:3px;
  opacity:0.15;transition:opacity 0.4s;
}
#logbox:hover{opacity:0.8;}
.logline{
  font-size:9px;letter-spacing:0.05em;
  color:rgba(180,180,210,0.3);
  text-align:right;
  animation:lin 0.25s ease;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.logline.r{color:rgba(255,26,74,0.65);}
.logline.g{color:rgba(0,255,170,0.55);}
.logline.b{color:rgba(51,153,255,0.55);}
@keyframes lin{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}

/* ── TOOLTIP ── */
#tooltip{
  position:absolute;
  background:rgba(8,8,15,0.95);
  border:1px solid var(--border);
  padding:8px 12px;
  font-size:9px;letter-spacing:0.07em;
  pointer-events:none;z-index:20;
  display:none;line-height:1.7;
  max-width:200px;
}

/* ── MODE INDICATOR ── */
#mode{
  position:absolute;top:20px;left:50%;transform:translateX(-50%);
  font-size:8px;letter-spacing:0.2em;text-transform:uppercase;
  color:rgba(255,255,255,0.06);z-index:10;pointer-events:none;
}
#mode span{color:rgba(0,255,170,0.15);}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- LEFT: shape palette -->
<div id="left">
  <div id="wordmark">living mesh</div>

  <div class="section-label">Logic Shapes</div>
  <div class="shape-btn active" data-type="memory" onclick="setTool(this,'memory')">
    <div class="shape-icon"><svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="none" stroke="#3399ff" stroke-width="1.5"/><circle cx="11" cy="11" r="3" fill="#3399ff" opacity="0.6"/></svg></div>
    memory
  </div>
  <div class="shape-btn" data-type="condition" onclick="setTool(this,'condition')">
    <div class="shape-icon"><svg viewBox="0 0 22 22"><polygon points="11,2 20,20 2,20" fill="none" stroke="#ffcc00" stroke-width="1.5"/></svg></div>
    if / condition
  </div>
  <div class="shape-btn" data-type="else" onclick="setTool(this,'else')">
    <div class="shape-icon"><svg viewBox="0 0 22 22"><polygon points="11,20 20,2 2,2" fill="none" stroke="#ff6688" stroke-width="1.5"/></svg></div>
    else
  </div>
  <div class="shape-btn" data-type="then" onclick="setTool(this,'then')">
    <div class="shape-icon"><svg viewBox="0 0 22 22"><rect x="3" y="3" width="16" height="16" rx="8" fill="none" stroke="#44ffcc" stroke-width="1.5"/></svg></div>
    then
  </div>
  <div class="shape-btn" data-type="loop" onclick="setTool(this,'loop')">
    <div class="shape-icon"><svg viewBox="0 0 22 22"><path d="M11 3 A8 8 0 1 1 3 11" fill="none" stroke="#cc44ff" stroke-width="1.5"/><polygon points="3,7 3,15 9,11" fill="#cc44ff"/></svg></div>
    loop / while
  </div>
  <div class="shape-btn" data-type="will" onclick="setTool(this,'will')">
    <div class="shape-icon"><svg viewBox="0 0 22 22"><polygon points="11,2 13.5,8.5 20,8.5 14.8,12.8 16.8,19.5 11,15.5 5.2,19.5 7.2,12.8 2,8.5 8.5,8.5" fill="none" stroke="#ddff00" stroke-width="1.5"/></svg></div>
    will / yes
  </div>
  <div class="shape-btn" data-type="lie" onclick="setTool(this,'lie')">
    <div class="shape-icon"><svg viewBox="0 0 22 22"><line x1="3" y1="3" x2="19" y2="19" stroke="#ff1a4a" stroke-width="1.5"/><line x1="19" y1="3" x2="3" y2="19" stroke="#ff1a4a" stroke-width="1.5"/></svg></div>
    no / refuse
  </div>
  <div class="shape-btn" data-type="truth" onclick="setTool(this,'truth')">
    <div class="shape-icon"><svg viewBox="0 0 22 22"><rect x="3" y="3" width="16" height="16" fill="none" stroke="#00ffaa" stroke-width="1.5"/></svg></div>
    truth / yes
  </div>
  <div class="shape-btn" data-type="fear" onclick="setTool(this,'fear')">
    <div class="shape-icon"><svg viewBox="0 0 22 22"><polygon points="11,2 20,11 11,20 2,11" fill="none" stroke="#ff7700" stroke-width="1.5"/></svg></div>
    fear / guard
  </div>

  <div class="section-label" style="margin-top:auto;">Tools</div>
  <div class="shape-btn" onclick="clearAll()" style="color:rgba(255,80,80,0.5);font-size:9px;">
    <div class="shape-icon"><svg viewBox="0 0 22 22"><line x1="4" y1="4" x2="18" y2="18" stroke="rgba(255,80,80,0.5)" stroke-width="1.5"/><line x1="18" y1="4" x2="4" y2="18" stroke="rgba(255,80,80,0.5)" stroke-width="1.5"/></svg></div>
    clear mesh
  </div>
  <div class="shape-btn" onclick="exportCode()" style="font-size:9px;">
    <div class="shape-icon"><svg viewBox="0 0 22 22"><polyline points="7,10 11,6 15,10" fill="none" stroke="var(--dim)" stroke-width="1.5"/><line x1="11" y1="6" x2="11" y2="16" stroke="var(--dim)" stroke-width="1.5"/><line x1="4" y1="18" x2="18" y2="18" stroke="var(--dim)" stroke-width="1.5"/></svg></div>
    export IR
  </div>
</div>

<!-- hidden language input (engine still uses this) -->
<div id="bottom">
  <input id="lang-input" placeholder="" />
</div>

<!-- SHAPE INPUT — the real interface -->
<div id="shape-input">
  <div id="shape-input-box" onclick="document.getElementById('shape-text').focus()">
    <canvas id="shape-preview" width="28" height="28"></canvas>
    <input id="shape-text" placeholder="type a shape..." autocomplete="off" spellcheck="false" />
  </div>
  <div id="op-plus" class="op-shape" onclick="chainPlus()" title="+ add shape">
    <svg viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="20" stroke="#cc44ff" stroke-width="2"/><line x1="4" y1="12" x2="20" y2="12" stroke="#cc44ff" stroke-width="2"/></svg>
  </div>
  <div id="op-equals" class="op-shape" onclick="chainEquals()" title="= resolve">
    <svg viewBox="0 0 24 24"><line x1="5" y1="9" x2="19" y2="9" stroke="#00ffaa" stroke-width="2"/><line x1="5" y1="15" x2="19" y2="15" stroke="#00ffaa" stroke-width="2"/></svg>
  </div>
</div>

<div id="chain"></div>
<div id="response"></div>

<div id="logbox"></div>
<div id="tooltip"></div>
<div id="autocomplete"></div>
<div id="meshbar">
  <div id="meshbar-track"><div id="meshbar-fill"><div id="meshbar-heal"></div></div></div>
  <div id="meshbar-msg"></div>
  <div id="meshbar-stage"></div>
  <div id="meshbar-pressure"></div>
</div>
<div id="empty-hint">
  <h2>god mesh</h2>
  <p>type a shape — the mesh becomes your declaration</p>
</div>
<div id="mode"><span id="mode-type"></span></div>

<script src="mesh.js" defer></script>
</body>
</html>
